name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Local-only placeholder credentials for the ephemeral CI Postgres
  # service — never used against real data, safe to keep in the workflow.
  DATABASE_URL: postgresql://nexus:nexus_ci_password@localhost:5432/nexus_ci
  AUTH_SECRET: ci-secret-do-not-use-in-production-0123456789
  API_CORS_ORIGINS: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci_password
          POSTGRES_DB: nexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
