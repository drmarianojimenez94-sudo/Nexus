# NEXUS — Render Blueprint
#
# One Render account, one click: "New +" -> "Blueprint" -> pick this repo.
# Render reads this file and provisions everything below by itself — one
# web service (API + web app, see scripts/render-start.sh for why they're
# one process) and one free Postgres database, already wired together.
#
# The only thing you do by hand afterwards: open the new service's
# Environment tab and set GEMINI_API_KEY if you want AI conversation and
# Today insights (get one at https://aistudio.google.com/apikey) — everything
# works without it, it just falls back to a simpler rule-based message.
#
# Free tier notes (so nothing here surprises you): the web service sleeps
# after 15 minutes idle and takes ~30-60s to wake back up on the next
# request; the free Postgres database expires after 90 days. Fine for
# trying NEXUS out; upgrade the plans below when it's not just a test.

databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus

services:
  - type: web
    name: nexus
    runtime: node
    plan: free
    # No `corepack enable` — Render's Node build image ships pnpm already,
    # and corepack's self-install step fails there (EROFS: /usr/bin is
    # read-only in that image).
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm db:generate &&
      pnpm --filter @nexus/api build &&
      pnpm --filter @nexus/web build
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_ACCESS_TOKEN_TTL
        value: 15m
      - key: AUTH_REFRESH_TOKEN_TTL
        value: 30d
      - key: API_CORS_ORIGINS
        value: http://localhost:3000
      - key: BACKEND_INTERNAL_URL
        value: http://localhost:4000
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash-lite
      # Optional, same pattern as AI_API_KEY — Settings just shows "not
      # configured" without these. See .env.example for how to get them
      # and why GOOGLE_REDIRECT_URI has to be set by hand (it depends on
      # this service's own URL, which Render only assigns after deploy).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Optional: email reminders. See docs/NEXUS_NOTIFICATIONS.md for the
      # full setup (a free Resend account + a repo secret on GitHub so the
      # scheduled dispatch workflow can reach this service).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: INTERNAL_DISPATCH_SECRET
        sync: false
