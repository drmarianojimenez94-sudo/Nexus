# NEXUS — Render Blueprint
#
# One Render account, one click: "New +" -> "Blueprint" -> pick this repo.
# Render reads this file and provisions everything below by itself — one
# web service (API + web app, see scripts/render-start.sh for why they're
# one process) and one free Postgres database, already wired together.
#
# The only thing you do by hand afterwards: open the new service's
# Environment tab and set AI_API_KEY if you want the real AI-generated
# Today insight (get one at https://console.anthropic.com) — everything
# works without it, it just falls back to a simpler rule-based message.
#
# Free tier notes (so nothing here surprises you): the web service sleeps
# after 15 minutes idle and takes ~30-60s to wake back up on the next
# request; the free Postgres database expires after 90 days. Fine for
# trying NEXUS out; upgrade the plans below when it's not just a test.

databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus

services:
  - type: web
    name: nexus
    env: node
    plan: free
    # No `corepack enable` — Render's Node build image ships pnpm already,
    # and corepack's self-install step fails there (EROFS: /usr/bin is
    # read-only in that image).
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm db:generate &&
      pnpm --filter @nexus/api build &&
      pnpm --filter @nexus/web build
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_ACCESS_TOKEN_TTL
        value: 15m
      - key: AUTH_REFRESH_TOKEN_TTL
        value: 30d
      - key: API_CORS_ORIGINS
        value: http://localhost:3000
      - key: BACKEND_INTERNAL_URL
        value: http://localhost:4000
      - key: NODE_ENV
        value: production
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-haiku-4-5
